name: depts
description: Debt tracking app with Google Sheets synchronization.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Google Auth & APIs
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.5.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
